name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # lint every video spec (draft timing; no audio or render needed)
      - run: for d in videos/*/; do npm run --silent check -- "$(basename "$d")"; done
